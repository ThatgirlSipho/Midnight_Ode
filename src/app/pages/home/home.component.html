
<section class="featured-section">
    <div class="containter-fluid">
        <div class="row">
            <div class="col-md-12 text-center mt-5">
                <h2 class="text-white"> Featured Posts</h2>
                
            </div>
        </div>
        <div class="row">
            <div class="col-lg-3" *ngFor="let featured of featuredArray">
                <app-post-card [postData]="featured"></app-post-card>
            </div>
            
        </div>
    </div>
   
</section>
<section class="container mt-5">
    <div class="col-md-12 text-center" >
        <h2> Latest Posts</h2>
       
    </div>
    <div class="row">
        <div class="col-md-4 mt-3" *ngFor="let late of LatestArray" >
            <app-post-card [postData]="late"></app-post-card>
        </div>
       
    </div>
</section>
